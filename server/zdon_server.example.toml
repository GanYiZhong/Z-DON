# Z-DON server settings. Copy to zdon_server.toml (same folder) and edit.

host = "0.0.0.0"      # 0.0.0.0 = every network interface; 127.0.0.1 = this PC only
port = 8730

# The key requests are signed with. Put the same text in each game's config.toml:
#   [network]
#   zdon_server_url = "http://<this PC>:8730"
#   zdon_server_key = "<the same key>"
# Empty = requests aren't checked (fine on a home LAN; set one before opening the port to the internet).
# The environment variable ZDON_SERVER_KEY overrides this.
auth_key = ""

data_dir = "zdon_data"          # SQLite database and published files (relative to this file)

# Skins put in the install zip only (not in updates), relative to the repository; every folder in it goes to
# Skins/. "build/skins_standalone" = standalone SimpleStyle + Dark from tools/zdon_bundle_simplestyle.sh.
bundled_skins_dir = ""
signature_window_s = 300        # how far a game's clock may be off

# Games older than this are shown as outdated (empty = never)
min_client_version = ""

# Events. Off by default: they change what the game shows.
tournament = false              # the gacha needs it
campaigns = []                  # campaign ids the skin knows
kinotake = false                # Kinoko/Takenoko team totals in /health
gacha_puchichara = []           # puchichara ids the gacha draws from

# true = every costume is unlocked for everyone (as offline); false = only those bought or won
force_unlock = true

[medals]
per_play = 1
daily_bonus = 3
max = 9999

# Reward shop lineup, one block per good:
# [[shop]]
# type = 4        # 2 dress, 3 head, 4 body, 5 puchichara, 6 title
# id = 12
# cost = 30
# name = ""       # titles only

# The website (zdon.taiko.ac). Members are TaikoForge's: "log in" goes through forge.taiko.ac's single sign-on.
[site]
url = "https://zdon.taiko.ac"                  # the public address (cookies are Secure when it is https)
name = "Z-DON"
sso_url = "https://forge.taiko.ac/sso/zdon"
# Same text as TaikoForge's TF_SSO_SECRET_ZDON (at least 16 characters). The environment variable
# ZDON_SSO_SECRET overrides this. Empty = the site works but nobody can log in.
sso_secret = ""
forge_url = "https://forge.taiko.ac"
# session_secret = ""   # signs the login cookie; empty = generated once into data_dir/site_secret.key

# `publish` (windows channel) also puts the install zip on a GitHub release that is replaced every time (a rolling
# release; needs the GitHub CLI `gh` logged in with write access). Empty = off. `publish --no-github` skips it once.
[github]
release_repo = ""               # e.g. "GanYiZhong/Z-DON"
tag = "rolling"
asset = "Z-DON-windows.zip"
workflow = ""                   # e.g. "zdon-release.yml": then also start the Linux / macOS / Android builds
